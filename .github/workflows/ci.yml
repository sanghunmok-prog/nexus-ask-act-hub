name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  repo-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repo skeleton
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/README.md
          test -f docs/NEXUS_MASTER.md
          test -f docs/API_CONTRACTS.md
          test -f docs/SECURITY.md
          test -f docs/DATA_MODEL.md
          test -f docs/DEMO_SCRIPT.md
          test -f .env.example
          test -f .gitignore
          test -f .github/workflows/ci.yml
          test -d docs
          test -d infra
          test -d src
          echo "PR-00 repo skeleton OK"